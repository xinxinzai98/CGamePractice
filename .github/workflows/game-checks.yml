name: Game checks
on:
  push:
    paths: ['client/**', 'packages/**', 'server/**', 'web/**', 'package*.json', '.github/workflows/game-checks.yml']
  pull_request:
    paths: ['client/**', 'packages/**', 'server/**', 'web/**', 'package*.json', '.github/workflows/game-checks.yml']
permissions:
  contents: read
jobs:
  client-and-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
